<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Signals</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Mono', 'SF Mono', Monaco, monospace;
            background: #fafafa;
            color: #111;
            line-height: 1.5;
            font-size: 12px;
        }

        .header {
            background: #fff;
            border-bottom: 2px solid #111;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .header-nav { display: flex; gap: 16px; }
        .header-nav a {
            font-size: 11px;
            text-decoration: none;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .header-nav a:hover { color: #111; }
        .header-nav a.active { color: #111; border-bottom: 2px solid #111; }

        .container { max-width: 1400px; margin: 0 auto; padding: 16px; }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 16px;
            font-size: 10px;
            color: #666;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .summary-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .summary-item {
            background: #fff;
            border: 1px solid #111;
            padding: 12px 16px;
            min-width: 140px;
        }
        .summary-label {
            font-size: 9px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .summary-value {
            font-size: 20px;
            font-weight: 700;
            transition: all 0.3s;
        }
        .summary-value.flash { animation: flash 0.5s ease-out; }
        @keyframes flash {
            0% { background: #fef08a; }
            100% { background: transparent; }
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .card {
            background: #fff;
            border: 1px solid #111;
        }
        .card-header {
            padding: 10px 12px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header.whale { border-left: 4px solid #111; }
        .card-header.new-token { border-left: 4px solid #16a34a; }
        .card-header.large-trade { border-left: 4px solid #dc2626; }

        .badge {
            font-size: 9px;
            padding: 2px 6px;
            font-weight: 600;
            text-transform: uppercase;
            background: #f3f4f6;
            color: #374151;
        }

        .card-body {
            max-height: 400px;
            overflow-y: auto;
        }

        .signal-item {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .signal-item:hover { background: #f9f9f9; }

        .signal-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .signal-token {
            font-weight: 700;
            font-size: 13px;
        }
        .signal-chain {
            font-size: 9px;
            color: #888;
            margin-left: 6px;
            text-transform: uppercase;
        }
        .signal-strength {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            text-transform: uppercase;
        }
        .signal-strength.strong { background: #111; color: #fff; }
        .signal-strength.moderate { background: #f3f4f6; color: #666; }

        .signal-flows {
            display: flex;
            gap: 16px;
            font-size: 11px;
            margin-bottom: 4px;
        }
        .signal-flow {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .signal-flow-label { color: #888; }
        .signal-flow-value { font-weight: 600; }
        .signal-flow-value.positive { color: #16a34a; }

        .signal-meta {
            font-size: 10px;
            color: #888;
        }

        .trade-signal {
            display: grid;
            grid-template-columns: 1fr 80px 60px;
            padding: 10px 12px;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
            cursor: pointer;
        }
        .trade-signal:hover { background: #f9f9f9; }
        .trade-trader {
            font-size: 11px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .trade-pair {
            font-size: 11px;
            margin-top: 4px;
        }
        .trade-pair .sold { color: #dc2626; }
        .trade-pair .bought { color: #16a34a; font-weight: 600; }
        .trade-value {
            font-weight: 700;
            font-size: 12px;
        }
        .trade-time {
            font-size: 10px;
            color: #888;
        }

        .loading {
            text-align: center;
            padding: 32px;
            color: #888;
        }
        .empty-state {
            text-align: center;
            padding: 32px;
            color: #888;
        }

        @media (max-width: 1000px) {
            .grid-2 { grid-template-columns: 1fr; }
            .summary-bar { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Alpha Signals</h1>
        <nav class="header-nav">
            <a href="/">Dashboard</a>
            <a href="/signals" class="active">Signals</a>
        </nav>
    </header>

    <main class="container">
        <div class="status-bar">
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span>LIVE</span>
            </div>
            <span id="lastUpdate">Loading...</span>
        </div>

        <div class="summary-bar">
            <div class="summary-item">
                <div class="summary-label">Whale Accumulation</div>
                <div class="summary-value" id="whaleCount">-</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">New Token Alpha</div>
                <div class="summary-value" id="newTokenCount">-</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Large Trades</div>
                <div class="summary-value" id="largeTradeCount">-</div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-header whale">
                    Whale Accumulation
                    <span class="badge">Strong inflows</span>
                </div>
                <div class="card-body" id="whaleSignals">
                    <div class="loading">Loading...</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header new-token">
                    New Token Alpha
                    <span class="badge">< 14 days old</span>
                </div>
                <div class="card-body" id="newTokenSignals">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header large-trade">
                Large Trades ($50K+)
                <span class="badge">Whale swaps</span>
            </div>
            <div class="card-body" id="largeTradeSignals">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </main>

    <script>
        let prevCounts = {};

        const fmt = {
            usd: (v) => {
                if (!v) return '-';
                const abs = Math.abs(v);
                const sign = v < 0 ? '-' : '+';
                if (abs >= 1e6) return sign + '$' + (abs/1e6).toFixed(1) + 'M';
                if (abs >= 1e3) return sign + '$' + (abs/1e3).toFixed(0) + 'K';
                return sign + '$' + abs.toFixed(0);
            },
            usdAbs: (v) => {
                if (!v) return '-';
                const abs = Math.abs(v);
                if (abs >= 1e6) return '$' + (abs/1e6).toFixed(1) + 'M';
                if (abs >= 1e3) return '$' + (abs/1e3).toFixed(0) + 'K';
                return '$' + abs.toFixed(0);
            },
            mcap: (v) => {
                if (!v) return '';
                if (v >= 1e9) return '$' + (v/1e9).toFixed(1) + 'B mcap';
                if (v >= 1e6) return '$' + (v/1e6).toFixed(0) + 'M mcap';
                return '$' + (v/1e3).toFixed(0) + 'K mcap';
            }
        };

        function goToToken(chain, address) {
            if (address) window.location.href = `/token/${chain}/${address}`;
        }

        function goToTrader(chain, address) {
            if (address) window.location.href = `/trader/${chain}/${address}`;
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = `Updated ${now.toLocaleTimeString()}`;
        }

        async function loadSignals() {
            try {
                const res = await fetch('/api/signals');
                const data = await res.json();

                const signals = data.signals || {};
                const summary = data.summary || {};

                // Update counts with flash animation
                ['whale_accumulation', 'new_token_alpha', 'large_trades'].forEach(key => {
                    const elId = key === 'whale_accumulation' ? 'whaleCount' :
                                 key === 'new_token_alpha' ? 'newTokenCount' : 'largeTradeCount';
                    const el = document.getElementById(elId);
                    const newCount = summary[key] || 0;
                    const changed = prevCounts[key] !== undefined && prevCounts[key] !== newCount;
                    prevCounts[key] = newCount;
                    el.textContent = newCount;
                    el.className = `summary-value ${changed ? 'flash' : ''}`;
                });

                // Whale Accumulation
                const whaleSignals = document.getElementById('whaleSignals');
                const whales = signals.whale_accumulation || [];
                if (whales.length) {
                    whaleSignals.innerHTML = whales.map(s => `
                        <div class="signal-item" onclick="goToToken('${s.chain}', '${s.token_address}')">
                            <div class="signal-top">
                                <div>
                                    <span class="signal-token">${s.token}</span>
                                    <span class="signal-chain">${s.chain}</span>
                                </div>
                                <span class="signal-strength ${s.strength.toLowerCase()}">${s.strength}</span>
                            </div>
                            <div class="signal-flows">
                                <div class="signal-flow">
                                    <span class="signal-flow-label">1h:</span>
                                    <span class="signal-flow-value positive">${fmt.usd(s.flow_1h)}</span>
                                </div>
                                <div class="signal-flow">
                                    <span class="signal-flow-label">24h:</span>
                                    <span class="signal-flow-value positive">${fmt.usd(s.flow_24h)}</span>
                                </div>
                                <div class="signal-flow">
                                    <span class="signal-flow-label">7d:</span>
                                    <span class="signal-flow-value positive">${fmt.usd(s.flow_7d)}</span>
                                </div>
                            </div>
                            <div class="signal-meta">${fmt.mcap(s.market_cap)}</div>
                        </div>
                    `).join('');
                } else {
                    whaleSignals.innerHTML = '<div class="empty-state">No whale accumulation signals</div>';
                }

                // New Token Alpha
                const newTokenSignals = document.getElementById('newTokenSignals');
                const newTokens = signals.new_token_alpha || [];
                if (newTokens.length) {
                    newTokenSignals.innerHTML = newTokens.map(s => `
                        <div class="signal-item" onclick="goToToken('${s.chain}', '${s.token_address}')">
                            <div class="signal-top">
                                <div>
                                    <span class="signal-token">${s.token}</span>
                                    <span class="signal-chain">${s.chain}</span>
                                </div>
                                <span class="signal-strength strong">${s.age_days}d old</span>
                            </div>
                            <div class="signal-flows">
                                <div class="signal-flow">
                                    <span class="signal-flow-label">24h flow:</span>
                                    <span class="signal-flow-value positive">${fmt.usd(s.flow_24h)}</span>
                                </div>
                                <div class="signal-flow">
                                    <span class="signal-flow-label">Traders:</span>
                                    <span class="signal-flow-value">${s.trader_count}</span>
                                </div>
                            </div>
                            <div class="signal-meta">${fmt.mcap(s.market_cap)}</div>
                        </div>
                    `).join('');
                } else {
                    newTokenSignals.innerHTML = '<div class="empty-state">No new token signals</div>';
                }

                // Large Trades
                const largeTradeSignals = document.getElementById('largeTradeSignals');
                const largeTrades = signals.large_trades || [];
                if (largeTrades.length) {
                    largeTradeSignals.innerHTML = largeTrades.map(t => `
                        <div class="trade-signal" onclick="goToTrader('${t.chain}', '${t.trader_address}')">
                            <div>
                                <div class="trade-trader">${t.trader || 'Unknown'}</div>
                                <div class="trade-pair">
                                    <span class="sold">${t.token_sold}</span>
                                    ->
                                    <span class="bought">${t.token_bought}</span>
                                </div>
                            </div>
                            <span class="trade-value">${fmt.usdAbs(t.value_usd)}</span>
                            <span class="trade-time">${t.time_ago}</span>
                        </div>
                    `).join('');
                } else {
                    largeTradeSignals.innerHTML = '<div class="empty-state">No large trades</div>';
                }

                updateTimestamp();
            } catch (e) {
                console.error('Signals error:', e);
                document.getElementById('whaleSignals').innerHTML = `<div class="error">Error: ${e.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadSignals);
        setInterval(loadSignals, 5000);
    </script>
</body>
</html>
