<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Activity Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            line-height: 1.5;
        }

        .header {
            background: #111;
            border-bottom: 1px solid #222;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.125rem; font-weight: 500; }
        .header-right { display: flex; gap: 1rem; align-items: center; }

        .filter {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: #e5e5e5;
            font-size: 0.875rem;
        }

        .btn {
            background: #2563eb;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: white;
            font-size: 0.875rem;
            cursor: pointer;
        }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #333; cursor: not-allowed; }

        .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 1rem;
        }
        .stat-label { font-size: 0.75rem; color: #666; text-transform: uppercase; margin-bottom: 0.25rem; }
        .stat-value { font-size: 1.5rem; font-weight: 600; font-family: 'SF Mono', monospace; }
        .stat-value.green { color: #22c55e; }
        .stat-value.red { color: #ef4444; }

        .grid { display: grid; grid-template-columns: 1fr 300px; gap: 1.5rem; }

        .card {
            background: #111;
            border: 1px solid #222;
            border-radius: 8px;
            overflow: hidden;
        }
        .card-header {
            padding: 1rem;
            border-bottom: 1px solid #222;
            font-weight: 500;
            font-size: 0.875rem;
        }

        .activity-list { max-height: 70vh; overflow-y: auto; }
        .activity-item {
            display: grid;
            grid-template-columns: 80px 120px 70px 100px 100px 100px 1fr 80px;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #1a1a1a;
            font-size: 0.8125rem;
            align-items: center;
        }
        .activity-item:hover { background: #1a1a1a; }

        .time { color: #666; font-family: 'SF Mono', monospace; font-size: 0.75rem; }
        .fund { color: #a5b4fc; font-weight: 500; }
        .action { font-weight: 500; }
        .action.received { color: #22c55e; }
        .action.sent { color: #ef4444; }
        .token { color: #fbbf24; font-weight: 500; }
        .amount { font-family: 'SF Mono', monospace; color: #888; }
        .usd { font-family: 'SF Mono', monospace; font-weight: 500; }
        .counterparty { color: #666; font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; }
        .chain {
            font-size: 0.625rem;
            background: #222;
            padding: 0.125rem 0.375rem;
            border-radius: 3px;
            text-transform: uppercase;
            color: #888;
        }

        .token-list { padding: 0.5rem 0; }
        .token-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 1rem;
            font-size: 0.8125rem;
        }
        .token-item:hover { background: #1a1a1a; }
        .token-name { color: #fbbf24; font-weight: 500; }
        .token-flow { font-family: 'SF Mono', monospace; }
        .token-flow.positive { color: #22c55e; }
        .token-flow.negative { color: #ef4444; }

        .loading { text-align: center; padding: 3rem; color: #666; }
        .error { color: #ef4444; padding: 1rem; background: #1a0a0a; margin: 1rem; border-radius: 6px; }

        @media (max-width: 1024px) {
            .grid { grid-template-columns: 1fr; }
            .activity-item { grid-template-columns: 60px 100px 60px 80px 80px 1fr; }
            .activity-item .counterparty, .activity-item .chain { display: none; }
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Fund Activity Tracker</h1>
        <div class="header-right">
            <select class="filter" id="minUsd">
                <option value="10000">Min $10K</option>
                <option value="50000">Min $50K</option>
                <option value="100000" selected>Min $100K</option>
                <option value="500000">Min $500K</option>
                <option value="1000000">Min $1M</option>
            </select>
            <button class="btn" id="refreshBtn" onclick="loadActivity()">Refresh</button>
        </div>
    </header>

    <main class="container">
        <section class="stats">
            <div class="stat">
                <div class="stat-label">Total Received</div>
                <div class="stat-value green" id="totalReceived">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Total Sent</div>
                <div class="stat-value red" id="totalSent">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Net Flow</div>
                <div class="stat-value" id="netFlow">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Transactions</div>
                <div class="stat-value" id="txCount">-</div>
            </div>
        </section>

        <section class="grid">
            <div class="card">
                <div class="card-header">Recent Activity</div>
                <div class="activity-list" id="activityList">
                    <div class="loading">Loading fund activity...</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Top Tokens by Flow</div>
                <div class="token-list" id="tokenList">
                    <div class="loading">Loading...</div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const fmt = {
            usd: (v) => {
                if (!v) return '$0';
                if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
                if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
                if (v >= 1e3) return '$' + (v/1e3).toFixed(0) + 'K';
                return '$' + v.toFixed(0);
            },
            num: (v) => {
                if (!v) return '0';
                if (v >= 1e9) return (v/1e9).toFixed(2) + 'B';
                if (v >= 1e6) return (v/1e6).toFixed(2) + 'M';
                if (v >= 1e3) return (v/1e3).toFixed(2) + 'K';
                return v.toFixed(2);
            }
        };

        async function loadActivity() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            const minUsd = document.getElementById('minUsd').value;

            try {
                const res = await fetch(`/api/activity?min_usd=${minUsd}`);
                const data = await res.json();

                // Update stats
                document.getElementById('totalReceived').textContent = fmt.usd(data.stats.total_received);
                document.getElementById('totalSent').textContent = fmt.usd(data.stats.total_sent);

                const netEl = document.getElementById('netFlow');
                netEl.textContent = fmt.usd(Math.abs(data.stats.net_flow));
                netEl.className = 'stat-value ' + (data.stats.net_flow >= 0 ? 'green' : 'red');
                netEl.textContent = (data.stats.net_flow >= 0 ? '+' : '-') + fmt.usd(Math.abs(data.stats.net_flow));

                document.getElementById('txCount').textContent = data.stats.transaction_count;

                // Update activity list
                const list = document.getElementById('activityList');
                if (!data.activity || data.activity.length === 0) {
                    list.innerHTML = '<div class="loading">No activity found</div>';
                } else {
                    list.innerHTML = data.activity.map(a => `
                        <div class="activity-item">
                            <span class="time">${a.time_ago}</span>
                            <span class="fund">${a.fund}</span>
                            <span class="action ${a.action.toLowerCase()}">${a.action}</span>
                            <span class="token">${a.token}</span>
                            <span class="amount">${fmt.num(a.amount)}</span>
                            <span class="usd">${fmt.usd(a.usd)}</span>
                            <span class="counterparty">${a.counterparty}</span>
                            <span class="chain">${a.chain}</span>
                        </div>
                    `).join('');
                }

                // Update token list
                const tokenList = document.getElementById('tokenList');
                if (!data.top_tokens || data.top_tokens.length === 0) {
                    tokenList.innerHTML = '<div class="loading">No token data</div>';
                } else {
                    tokenList.innerHTML = data.top_tokens.map(t => `
                        <div class="token-item">
                            <span class="token-name">${t.token}</span>
                            <span class="token-flow ${t.net >= 0 ? 'positive' : 'negative'}">
                                ${t.net >= 0 ? '+' : ''}${fmt.usd(t.net)}
                            </span>
                        </div>
                    `).join('');
                }

            } catch (e) {
                console.error('Error:', e);
                document.getElementById('activityList').innerHTML =
                    '<div class="error">Failed to load activity: ' + e.message + '</div>';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Refresh';
            }
        }

        // Load on start
        document.addEventListener('DOMContentLoaded', loadActivity);

        // Reload when filter changes
        document.getElementById('minUsd').addEventListener('change', loadActivity);
    </script>
</body>
</html>
