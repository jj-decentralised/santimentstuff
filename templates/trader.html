<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader Profile</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Mono', 'SF Mono', Monaco, monospace;
            background: #fafafa;
            color: #111;
            line-height: 1.5;
            font-size: 12px;
        }

        .header {
            background: #fff;
            border-bottom: 2px solid #111;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }
        .header-nav { display: flex; gap: 16px; }
        .header-nav a {
            font-size: 11px;
            text-decoration: none;
            color: #666;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .header-nav a:hover { color: #111; }

        .container { max-width: 1200px; margin: 0 auto; padding: 16px; }

        .trader-header {
            background: #fff;
            border: 1px solid #111;
            padding: 16px;
            margin-bottom: 16px;
        }
        .trader-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        .trader-label {
            font-size: 16px;
            font-weight: 700;
        }
        .trader-chain {
            font-size: 10px;
            padding: 2px 8px;
            background: #f3f4f6;
            text-transform: uppercase;
        }
        .trader-address {
            font-size: 11px;
            color: #666;
            word-break: break-all;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
            margin-bottom: 16px;
            font-size: 10px;
            color: #666;
        }
        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: #fff;
            border: 1px solid #111;
            padding: 12px;
            text-align: center;
        }
        .stat-label {
            font-size: 9px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            transition: all 0.3s;
        }
        .stat-value.positive { color: #16a34a; }
        .stat-value.negative { color: #dc2626; }
        .stat-value.neutral { color: #111; }
        .stat-value.flash { animation: flash 0.5s ease-out; }
        @keyframes flash {
            0% { background: #fef08a; }
            100% { background: transparent; }
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .card {
            background: #fff;
            border: 1px solid #111;
        }
        .card-header {
            padding: 10px 12px;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-header.tokens { border-left: 4px solid #16a34a; }
        .card-header.history { border-left: 4px solid #111; }

        .badge {
            font-size: 9px;
            padding: 2px 6px;
            font-weight: 600;
            text-transform: uppercase;
            background: #f3f4f6;
            color: #374151;
        }

        .card-body {
            max-height: 400px;
            overflow-y: auto;
        }

        .row-header {
            display: grid;
            padding: 8px 12px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            color: #666;
            background: #f9f9f9;
            border-bottom: 1px solid #eee;
        }
        .token-row-header { grid-template-columns: 80px 1fr 80px; }
        .tx-row-header { grid-template-columns: 60px 1fr 80px; }

        .token-item {
            display: grid;
            grid-template-columns: 80px 1fr 80px;
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
            cursor: pointer;
        }
        .token-item:hover { background: #f9f9f9; }
        .token-symbol {
            font-weight: 600;
        }
        .token-chain {
            font-size: 9px;
            color: #888;
            margin-left: 4px;
        }
        .token-roi {
            font-size: 10px;
            color: #888;
        }
        .token-pnl {
            font-weight: 600;
            text-align: right;
        }
        .token-pnl.positive { color: #16a34a; }
        .token-pnl.negative { color: #dc2626; }

        .tx-item {
            display: grid;
            grid-template-columns: 60px 1fr 80px;
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
            align-items: center;
            font-size: 11px;
        }
        .tx-time {
            font-size: 10px;
            color: #888;
        }
        .tx-tokens { font-size: 11px; }
        .tx-tokens .sent { color: #dc2626; }
        .tx-tokens .received { color: #16a34a; }
        .tx-value {
            font-weight: 600;
            text-align: right;
        }

        .loading {
            text-align: center;
            padding: 32px;
            color: #888;
        }
        .error {
            color: #dc2626;
            padding: 12px;
            background: #fee2e2;
        }

        @media (max-width: 900px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .grid-2 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>Trader Profile</h1>
        <nav class="header-nav">
            <a href="/">Dashboard</a>
            <a href="/signals">Signals</a>
        </nav>
    </header>

    <main class="container">
        <div class="trader-header">
            <div class="trader-title">
                <span class="trader-label" id="traderLabel">Smart Trader</span>
                <span class="trader-chain">{{ chain }}</span>
            </div>
            <div class="trader-address">{{ address }}</div>
        </div>

        <div class="status-bar">
            <div class="live-indicator">
                <span class="live-dot"></span>
                <span>LIVE</span>
            </div>
            <span id="lastUpdate">Loading...</span>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Realized P/L</div>
                <div class="stat-value neutral" id="realizedPnl">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value neutral" id="winRate">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Tokens Traded</div>
                <div class="stat-value neutral" id="tokensTraded">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Trades</div>
                <div class="stat-value neutral" id="totalTrades">-</div>
            </div>
        </div>

        <div class="grid-2">
            <section class="card">
                <div class="card-header tokens">
                    Top Tokens
                    <span class="badge">Best performers</span>
                </div>
                <div class="row-header token-row-header">
                    <span>Token</span>
                    <span>ROI</span>
                    <span style="text-align:right">P/L</span>
                </div>
                <div class="card-body" id="topTokens">
                    <div class="loading">Loading...</div>
                </div>
            </section>

            <section class="card">
                <div class="card-header history">
                    Recent Transactions
                    <span class="badge">Last 30 days</span>
                </div>
                <div class="row-header tx-row-header">
                    <span>Time</span>
                    <span>Tokens</span>
                    <span style="text-align:right">Value</span>
                </div>
                <div class="card-body" id="txHistory">
                    <div class="loading">Loading...</div>
                </div>
            </section>
        </div>
    </main>

    <script>
        const chain = '{{ chain }}';
        const address = '{{ address }}';
        let prevPnl = null;

        const fmt = {
            usd: (v) => {
                if (!v && v !== 0) return '-';
                const abs = Math.abs(v);
                const sign = v < 0 ? '-' : '+';
                if (abs >= 1e6) return sign + '$' + (abs/1e6).toFixed(1) + 'M';
                if (abs >= 1e3) return sign + '$' + (abs/1e3).toFixed(1) + 'K';
                return sign + '$' + abs.toFixed(0);
            },
            usdAbs: (v) => {
                if (!v && v !== 0) return '-';
                const abs = Math.abs(v);
                if (abs >= 1e6) return '$' + (abs/1e6).toFixed(1) + 'M';
                if (abs >= 1e3) return '$' + (abs/1e3).toFixed(1) + 'K';
                return '$' + abs.toFixed(0);
            },
            pct: (v) => {
                if (!v && v !== 0) return '-';
                return (v * 100).toFixed(0) + '%';
            },
            roi: (v) => {
                if (!v && v !== 0) return '';
                const sign = v > 0 ? '+' : '';
                return sign + v.toFixed(0) + '% ROI';
            }
        };

        function goToToken(tokenAddress) {
            if (tokenAddress) window.location.href = `/token/${chain}/${tokenAddress}`;
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = `Updated ${now.toLocaleTimeString()}`;
        }

        async function loadTraderData() {
            try {
                const res = await fetch(`/api/trader/${chain}/${address}`);
                const data = await res.json();

                const pnl = data.pnl_summary || {};
                const realizedPnl = pnl.realized_pnl || 0;
                const pnlEl = document.getElementById('realizedPnl');
                const changed = prevPnl !== null && prevPnl !== realizedPnl;
                prevPnl = realizedPnl;

                pnlEl.textContent = fmt.usd(realizedPnl);
                pnlEl.className = `stat-value ${realizedPnl >= 0 ? 'positive' : 'negative'} ${changed ? 'flash' : ''}`;

                const winRate = pnl.win_rate || 0;
                document.getElementById('winRate').textContent = fmt.pct(winRate);
                document.getElementById('winRate').className = `stat-value ${winRate >= 0.5 ? 'positive' : 'negative'}`;

                document.getElementById('tokensTraded').textContent = pnl.traded_tokens || 0;
                document.getElementById('totalTrades').textContent = pnl.total_trades || 0;

                const topTokens = document.getElementById('topTokens');
                const tokens = data.top_tokens || [];

                if (tokens.length) {
                    topTokens.innerHTML = tokens.map(t => {
                        const pnlClass = t.pnl >= 0 ? 'positive' : 'negative';
                        return `
                            <div class="token-item" onclick="goToToken('${t.address}')">
                                <div>
                                    <span class="token-symbol">${t.symbol}</span>
                                    <span class="token-chain">${t.chain.toUpperCase()}</span>
                                </div>
                                <div class="token-roi">${fmt.roi(t.roi)}</div>
                                <div class="token-pnl ${pnlClass}">${fmt.usd(t.pnl)}</div>
                            </div>
                        `;
                    }).join('');
                } else {
                    topTokens.innerHTML = '<div class="loading">No token data</div>';
                }

                const txHistory = document.getElementById('txHistory');
                const txs = data.transactions || [];

                if (txs.length) {
                    txHistory.innerHTML = txs.map(tx => {
                        const sent = tx.tokens_sent?.map(t => t.token_symbol || '?').join(', ') || '';
                        const received = tx.tokens_received?.map(t => t.token_symbol || '?').join(', ') || '';
                        return `
                            <div class="tx-item">
                                <span class="tx-time">${tx.time_ago}</span>
                                <div class="tx-tokens">
                                    ${sent ? `<span class="sent">-${sent}</span>` : ''}
                                    ${sent && received ? ' -> ' : ''}
                                    ${received ? `<span class="received">+${received}</span>` : ''}
                                </div>
                                <span class="tx-value">${fmt.usdAbs(tx.volume_usd)}</span>
                            </div>
                        `;
                    }).join('');
                } else {
                    txHistory.innerHTML = '<div class="loading">No transactions</div>';
                }

                updateTimestamp();
            } catch (e) {
                console.error('Error:', e);
                document.getElementById('topTokens').innerHTML = `<div class="error">Error: ${e.message}</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', loadTraderData);
        setInterval(loadTraderData, 5000);
    </script>
</body>
</html>
